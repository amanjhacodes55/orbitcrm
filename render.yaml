# Render Blueprint — Dashboard → New → Blueprint → select this repo.
# You'll be asked for MONGODB_URI (e.g. a free MongoDB Atlas M0 connection string) and ADMIN_EMAILS.
services:
  - type: web
    name: orbitcrm
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: ADMIN_EMAILS
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: SMTP_URL
        sync: false
